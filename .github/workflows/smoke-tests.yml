# GitHub Actions: runs the @smoke tests on every push to main and on every pull request.
# Required repository secrets (Settings > Secrets and variables > Actions):
#   TACTIVE_BASE_URL, TACTIVE_USERNAME, TACTIVE_PASSWORD

name: Smoke Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # 👇 NEW STEP: Safely prints whether the secrets are populated or missing in GitHub
      - name: Verify Secrets Reception
        env:
          TACTIVE_BASE_URL: ${{ secrets.TACTIVE_BASE_URL }}
          TACTIVE_USERNAME: ${{ secrets.TACTIVE_USERNAME }}
          TACTIVE_PASSWORD: ${{ secrets.TACTIVE_PASSWORD }}
        run: |
          echo "=== Diagnostic Secret Check ==="
          [ -z "$TACTIVE_BASE_URL" ] && echo "❌ URL Secret is EMPTY" || echo "✅ URL Secret is Received (Length: ${#TACTIVE_BASE_URL})"
          [ -z "$TACTIVE_USERNAME" ] && echo "❌ Username Secret is EMPTY" || echo "✅ Username Secret is Received (Length: ${#TACTIVE_USERNAME})"
          [ -z "$TACTIVE_PASSWORD" ] && echo "❌ Password Secret is EMPTY" || echo "✅ Password Secret is Received (Length: ${#TACTIVE_PASSWORD})"
          echo "==============================="

      - name: Create env/.env.stage from secrets
        env:
          TACTIVE_BASE_URL: ${{ secrets.TACTIVE_BASE_URL }}
          TACTIVE_USERNAME: ${{ secrets.TACTIVE_USERNAME }}
          TACTIVE_PASSWORD: ${{ secrets.TACTIVE_PASSWORD }}
        run: |
          mkdir -p env
          printf 'TACTIVE_BASE_URL=%s\nTACTIVE_USERNAME=%s\nTACTIVE_PASSWORD=%s\n' \
            "$TACTIVE_BASE_URL" "$TACTIVE_USERNAME" "$TACTIVE_PASSWORD" > env/.env.stage

      # Safe verification: Only checks if the file exists and has data (no grep on secrets)
      - name: Verify stage environment file existence
        run: |
          if [ ! -s env/.env.stage ]; then
            echo "::error::Environment file is missing or empty!"
            exit 1
          fi
          echo "✅ env/.env.stage created successfully."

      - name: Install Chromium and its dependencies
        run: >
          mvn -B -q exec:java
          -Dexec.classpathScope=test
          -Dexec.mainClass=com.microsoft.playwright.CLI
          -Dexec.args="install --with-deps chromium"

      # Added HEADLESS: true to prevent execution loops in Linux environments
      - name: Run smoke tests
        env:
          HEADLESS: "true" 
        run: mvn -B clean test -Dcucumber.filter.tags="@smoke and not @local-only"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/cucumber-reports/
            target/surefire-reports/
            target/screenshots/
            test-output/
          if-no-files-found: ignore
          retention-days: 14
