# GitHub Actions: runs the @smoke tests on every push to main and on every pull request.
# Required repository secrets (Settings > Secrets and variables > Actions):
#   TACTIVE_BASE_URL, TACTIVE_USERNAME, TACTIVE_PASSWORD

name: Smoke Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Create env/.env.stage from secrets
        env:
          TACTIVE_BASE_URL: ${{ secrets.TACTIVE_BASE_URL }}
          TACTIVE_USERNAME: ${{ secrets.TACTIVE_USERNAME }}
          TACTIVE_PASSWORD: ${{ secrets.TACTIVE_PASSWORD }}
        run: |
          mkdir -p env
          printf 'TACTIVE_BASE_URL=%s\nTACTIVE_USERNAME=%s\nTACTIVE_PASSWORD=%s\n' \
            "$TACTIVE_BASE_URL" "$TACTIVE_USERNAME" "$TACTIVE_PASSWORD" > env/.env.stage

      - name: Verify stage environment configuration
        run: |
          test -s env/.env.stage || {
            echo "Environment file is missing or empty"
            exit 1
          }

          grep -q '^TACTIVE_BASE_URL=.' env/.env.stage \
            && echo "Base URL is present" \
            || { echo "Base URL is missing or empty"; exit 1; }

          grep -q '^TACTIVE_USERNAME=.' env/.env.stage \
            && echo "Username is present" \
            || { echo "Username is missing or empty"; exit 1; }

          grep -q '^TACTIVE_PASSWORD=.' env/.env.stage \
            && echo "Password is present" \
            || { echo "Password is missing or empty"; exit 1; }

      - name: Install Chromium and its dependencies
        run: >
          mvn -B -q exec:java
          -Dexec.classpathScope=test
          -Dexec.mainClass=com.microsoft.playwright.CLI
          -Dexec.args="install --with-deps chromium"

      - name: Run smoke tests
        run: mvn -B clean test -Dcucumber.filter.tags="@smoke and not @local-only"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/cucumber-reports/
            target/surefire-reports/
            target/screenshots/
            test-output/
          if-no-files-found: ignore
          retention-days: 14